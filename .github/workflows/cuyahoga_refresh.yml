name: Cuyahoga County Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'  # 6:00 AM Mountain (MDT), weekdays
    - cron: '30 19 * * 1-5'  # 1:30 PM Mountain (MDT), weekdays

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cuyahoga sheriff/foreclosure refresh
        run: |
          python scraper/counties/cuyahoga.py --enrich-foreclosures

      - name: Update refresh status and commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/cuyahoga/records.json
          if git diff --cached --quiet; then
            python tools/update_refresh_status.py --county cuyahoga --status no_change --message "Refresh ran, no new sheriff/foreclosure data found"
          else
            FETCHED_AT=$(python -c "import json; print(json.load(open('dashboard/cuyahoga/records.json'))['fetched_at'])")
            python tools/update_refresh_status.py --county cuyahoga --status success --message "Refresh ran and merged new sheriff/foreclosure data" --data-updated-at "$FETCHED_AT"
          fi
          git add dashboard/refresh_status.json
          git diff --cached --quiet || git commit -m "[scraper] refresh Cuyahoga data"
          git push

      - name: Record refresh failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/update_refresh_status.py --county cuyahoga --status failed --message "Cuyahoga refresh step failed - see workflow run logs"
          git add dashboard/refresh_status.json
          git diff --cached --quiet || git commit -m "[dashboard] record Cuyahoga refresh failure"
          git push
