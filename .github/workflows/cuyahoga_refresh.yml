name: Cuyahoga County Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'  # 6:00 AM Mountain (MDT), weekdays
    - cron: '30 19 * * 1-5'  # 1:30 PM Mountain (MDT), weekdays

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cuyahoga sheriff/foreclosure refresh
        run: |
          python scraper/counties/cuyahoga.py --enrich-foreclosures

      - name: Commit updated Cuyahoga data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/cuyahoga/records.json
          git diff --cached --quiet || git commit -m "[scraper] refresh Cuyahoga data"
          git push
