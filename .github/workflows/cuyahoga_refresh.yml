name: Cuyahoga County Refresh

on:
  # Scheduled runs moved to .github/workflows/daily_refresh_all.yml, which
  # covers Summit + Cuyahoga from one place. Kept here as a manual/debug
  # fallback only - now a thin call into the same orchestrator.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Cuyahoga refresh via orchestrator
        run: |
          python tools/run_daily_refresh_all.py --county cuyahoga --commit --push
