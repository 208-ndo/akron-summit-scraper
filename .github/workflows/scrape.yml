name: Summit County Scraper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper/fetch.py'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: '0 12 * * 1-5'  # 6:00 AM Mountain (MDT), weekdays
    - cron: '30 19 * * 1-5'  # 1:30 PM Mountain (MDT), weekdays

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTO_SKIP_TRACE_DISABLED: '1'

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4 lxml playwright pypdf cryptography

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ensure trace_store.json exists
        run: |
          if [ ! -f trace_store.json ]; then
            echo "{}" > trace_store.json
          fi

      - name: Run scraper
        run: |
          python scraper/fetch.py \
            --records data/records.json \
            --out-json data/records.enriched.json \
            --out-csv data/records.enriched.csv \
            --report data/match_report.json \
            --property-access-scope priority

      - name: Update refresh status and commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/ trace_store.json
          if git diff --cached --quiet; then
            python tools/update_refresh_status.py --county summit --status no_change --message "Scraper ran, no new data found"
          else
            FETCHED_AT=$(python -c "import json; print(json.load(open('dashboard/records.json'))['fetched_at'])")
            python tools/update_refresh_status.py --county summit --status success --message "Scraper ran and found updated data" --data-updated-at "$FETCHED_AT"
          fi
          git add dashboard/refresh_status.json
          git diff --cached --quiet || git commit -m "Update scraper data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Record refresh failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/update_refresh_status.py --county summit --status failed --message "Scraper step failed - see workflow run logs"
          git add dashboard/refresh_status.json
          git diff --cached --quiet || git commit -m "[dashboard] record Summit refresh failure"
          git push
