name: Daily Refresh - Summit & Cuyahoga

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'  # 6:00 AM Mountain (MDT), weekdays
    - cron: '30 19 * * 1-5'  # 1:30 PM Mountain (MDT), weekdays

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTO_SKIP_TRACE_DISABLED: '1'

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4 lxml playwright pypdf cryptography

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ensure trace_store.json exists
        run: |
          if [ ! -f trace_store.json ]; then
            echo "{}" > trace_store.json
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run daily refresh - Summit and Cuyahoga
        run: |
          python tools/run_daily_refresh_all.py --county summit --county cuyahoga --commit --push
