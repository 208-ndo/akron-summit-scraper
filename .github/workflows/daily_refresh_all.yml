name: Daily Refresh - Summit, Cuyahoga & Montgomery

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit/push, refresh only)'
        type: boolean
        default: false
  schedule:
    - cron: '0 12 * * *'    # 6:00 AM Mountain (MDT), every day
    - cron: '30 19 * * 1-5'  # 1:30 PM Mountain (MDT), weekdays

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTO_SKIP_TRACE_DISABLED: '1'

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4 lxml playwright pypdf cryptography

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ensure trace_store.json exists
        run: |
          if [ ! -f trace_store.json ]; then
            echo "{}" > trace_store.json
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run daily refresh - Summit, Cuyahoga and Montgomery
        # Montgomery's source CSV lives only on the operator's machine, so on
        # this runner it honestly reports manual_needed and moves its
        # last_checked_at - it never fakes data (tools/refresh_counties.py
        # returns skipped_source_missing and old data is preserved).
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tools/run_daily_refresh_all.py --county summit --county cuyahoga --county montgomery
          else
            python tools/run_daily_refresh_all.py --county summit --county cuyahoga --county montgomery --commit --push
          fi
